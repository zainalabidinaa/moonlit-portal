<!doctype html><html><head><meta charset="utf-8"><title>Moonlit install guide</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:900px;margin:0 auto;padding:32px}h1{font-size:32px}button{background:#6ea8fe;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}.muted{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.panel{border:1px solid #444;border-radius:14px;padding:28px;min-height:180px;background:#1c1c1c}.mock{border:2px solid #777;border-radius:10px;padding:28px;text-align:center;margin-top:18px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.step{padding:8px 12px;border-radius:99px;background:#333}.active{background:#6ea8fe;color:#111}.arrow{font-size:32px;text-align:center;padding-top:75px}</style></head><body><div id="app"></div><script>const s=[['1. Create the free account','Android Developer Console','You choose Personal → Limited distribution.'],['2. Register Moonlit','Register app','Upload the signed Moonlit APK.'],['3. Generate an invite','Moonlit device invite','Create a link and QR code.'],['4. User scans the QR code','Scan to authorize this TV','The user scans with their phone.'],['5. User approves the TV','Authorize device','They approve this specific TV.'],['6. Moonlit installs','Moonlit installed','They open Moonlit from the TV app list.']];let i=0;function render(){let x=s[i];app.innerHTML=`<p class="muted">MOONLIT BETA · LIMITED DISTRIBUTION · FREE · UP TO 20 DEVICES</p><h1>${x[0]}</h1><p class="muted">Step ${i+1} of ${s.length}</p><div class="grid"><div class="panel"><b>${x[1]}</b><div class="mock">${i===3?'▦ QR CODE':i===4?'THIS TV':'MOONLIT'}<br><br><button>${i===5?'Open Moonlit':x[0].replace(/^\d+\. /,'')}</button></div></div><div class="arrow">→</div><div class="panel"><b>What the user does</b><p>${x[2]}</p></div></div><div class="steps">${s.map((_,n)=>`<span class="step ${n===i?'active':''}">${n+1}</span>`).join('')}</div><button onclick="i=Math.max(0,i-1);render()" ${i?'':'disabled'}>Back</button> <button onclick="i=Math.min(s.length-1,i+1);render()">${i===s.length-1?'Done':'Next'}</button>`}render();</script></body></html>
