name: Deploy support-notify

# Deploys the support-notify edge function from CI so it does not depend on a
# working local Supabase CLI. Needs one repository secret:
#
#   SUPABASE_ACCESS_TOKEN — https://supabase.com/dashboard/account/tokens
#   (Settings → Secrets and variables → Actions → New repository secret)
#
# Until that secret exists the job skips instead of failing, so it stays quiet.
# The project ref is not a secret: it is already in the public client bundle.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/support-notify/**'
      - '.github/workflows/deploy-support-notify.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: hvfsntdyowapjxobtyli
    steps:
      - uses: actions/checkout@v4

      - name: Check for access token
        id: guard
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set — skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        if: steps.guard.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt: the contact page is public, so visitors who are not
      # signed in have to be able to invoke this.
      - name: Deploy
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy support-notify \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
